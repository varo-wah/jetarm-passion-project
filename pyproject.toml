[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jetarm-passion-project"
version = "0.1.0"
description = "JetArm AI sorting machine runtime and YOLO training pipeline."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "opencv-python",
    "numpy",
    "requests",
    "ultralytics",
]

[tool.setuptools.packages.find]
where = ["src"]

